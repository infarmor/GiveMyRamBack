name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Check translations
        run: python3 scripts/update_strings.py --check
      - name: Build app bundle
        run: ./scripts/build_app.sh release
